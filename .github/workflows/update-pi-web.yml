name: Update pi-web

# 把 packages/pi-web/README 的升级流程自动化成「开一个可合并的 PR」。版本号 + 三个
# FOD hash（src、npmDeps、next/font 的离线字体 FOD）全部委托给
# dev/pi-web/upgrade.sh（本地与 CI 同一套实现）。pi-web 走 npm 路线：上游 tag 自带
# package-lock.json，仓库内不存 lock 副本，所以这里没有 lockfile 转译、
# allowBuilds、幽灵依赖那几段（对照 update-pi-web-ui.yml）。
#
# 验证只做 nix build + nix run 自检，全量 flake check 交给 PR 上的 ci.yml，
# 不在这里重复跑 VM 测试。

on:
  schedule:
    # 04:00 UTC / 12:00 北京时间；与 pi-web-ui 的 03:00 错开，避免同时占满 runner
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version (v prefix optional). Empty = newest stable release
        required: false
        default: ""
      dry_run:
        description: Run the update and the self-check, write the job summary, do not open/update a PR
        type: boolean
        default: false

concurrency:
  # 与 pi-web-ui 的更新任务互不影响：各自串行、各自复用分支
  group: update-pi-web
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: agegr/pi-web
  PKG: packages/pi-web/package.nix

jobs:
  update:
    runs-on: ubuntu-24.04
    # npm ci + next build（webpack）+ node-pty，留足余量
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # v21 起 determinate 默认 true（会改装 Determinate Nix 并登录 FlakeHub），
      # 显式关闭以继续使用上游 Nix，保持与 v16 相同的行为
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Resolve upstream version
        id: version
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^[[:space:]]*version = "\(.*\)";.*/\1/p' "$PKG" | head -1)
          if [ -n "${REQUESTED:-}" ]; then
            new="${REQUESTED#v}"
          else
            # releases/latest 天然排除 prerelease 与 draft
            new=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name | sed 's/^v//')
          fi
          if ! printf '%s' "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::cannot determine a version number from '${new}'"
            exit 1
          fi
          {
            echo "current=${current}"
            echo "new=${new}"
            echo "changed=$([ "$current" != "$new" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "$PKG: ${current} -> ${new}"

      # 版本号与三个 FOD hash 由脚本迭代完成：先置 fakeHash 强制真实 fetch
      # （避开热 store 静默复用），再从 hash mismatch 的 got: 逐个写回
      - name: Iterate the FOD hashes until the build passes
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          UPGRADE_TARGET_VERSION: ${{ steps.version.outputs.new }}
        run: ./dev/pi-web/upgrade.sh --no-flake-check

      - name: Compose the pull request body
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          OLD_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Automated update of [pi-web](https://github.com/${UPSTREAM}) \`${OLD_VERSION}\` → \`${NEW_VERSION}\`."
            echo
            echo "- Upstream release: https://github.com/${UPSTREAM}/releases/tag/v${NEW_VERSION}"
            echo "- No lockfile is vendored: \`fetchNpmDeps\` consumes the tag's own \`package-lock.json\`."
            echo
            echo "### Fixed-output (FOD) hashes"
            echo
            echo '```diff'
            git diff -U0 -- "$PKG" | grep -E '^[+-][[:space:]]*(sha256|npmDepsHash|outputHash) =' || true
            echo '```'
            echo "\`outputHash\` belongs to the offline copy of Google Fonts' CSS + Noto Sans Mono woff2 subsets that \`next/font/google\` needs (the build sandbox has no network). If the diff moves it, check that \`notoFontsCssUrl\` still matches the font config in \`app/layout.tsx\`."
            echo
            echo "\`dev/pi-web/upgrade.sh\` ran \`nix build .#pi-web\` and \`nix run .#pi-web -- --version\` in [this run](${RUN_URL}); the full \`nix flake check\` (NixOS VM test + home-manager) runs in this PR's CI."
            echo
            echo "Generated by \`.github/workflows/update-pi-web.yml\`. The branch \`update/pi-web\` is reused, so the next run rebuilds this same PR from \`main\`."
          } > /tmp/pi-web-pr-body.md

      - name: Write the job summary
        if: ${{ !cancelled() }}
        env:
          OLD_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          set -uo pipefail
          {
            echo "## pi-web ${OLD_VERSION:-?} → ${NEW_VERSION:-?}"
            echo
            if [ "${CHANGED}" != "true" ]; then
              echo "$PKG already carries the target version (or the version could not be resolved); nothing was changed."
            else
              echo "### Changed files"
              git diff --stat
              echo "### $PKG"
              git diff -- "$PKG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        # 显式写 success()：构建或自检失败时绝不能开出 PR（不依赖隐式的 success()）
        if: ${{ success() && steps.version.outputs.changed == 'true' && !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          # GITHUB_TOKEN 创建的 PR 不会正常触发 ci.yml，因此优先用 PAT
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: update/pi-web
          base: main
          delete-branch: false
          # 只提交 package.nix（该包无仓库内 lockfile），避免把构建残留带进 PR
          add-paths: |
            packages/pi-web/package.nix
          commit-message: "chore: bump pi-web to ${{ steps.version.outputs.new }}"
          title: "chore: bump pi-web to ${{ steps.version.outputs.new }}"
          body-path: /tmp/pi-web-pr-body.md
