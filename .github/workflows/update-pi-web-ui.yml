name: Update pi-web-ui

# 把 packages/pi-web-ui/README 那套升级流程自动化成「开一个可合并的 PR」。版本号、
# pnpm-lock.yaml、src / pnpmDeps 两个 FOD hash、allowBuilds、幽灵依赖的
# publicHoistPattern —— 全部委托给 dev/pi-web-ui/upgrade.sh（本地与 CI 同一套实现，
# 避免两处逻辑漂移）。验证只做 nix build + nix run 自检，全量 flake check 交给
# PR 上的 ci.yml，不在这里重复跑 VM 测试。
#
# 姊妹 workflow：update-pi-web.yml（pi-web 走 npm 路线，add-paths 只有一个
# package.nix，没有 lockfile/allowBuilds 段）。
#
# 为什么不用 nix-update：它只在「同一次运行真的改写了版本号」时才修 hash
# （update.py 的 update_hash 门控，以及 dependency_hashes.py 里
# `if not (update_hash or not package.hash) ...: return`），而 pnpmDeps 的 hash
# 必须在 pnpm-lock.yaml 重新生成之后才能算出来 —— 这两步没法在同一次 nix-update
# 运行里同时满足，所以走 upgrade.sh 的 got: 循环。

on:
  schedule:
    # 03:00 UTC / 11:00 北京时间
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version (v prefix optional). Empty = newest stable release
        required: false
        default: ""
      dry_run:
        description: Run the update and the self-check, write the job summary, do not open/update a PR
        type: boolean
        default: false

concurrency:
  # 串行执行且不取消进行中的运行：半成品工作区没有价值
  group: update-pi-web-ui
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: xing-shuyin/pi-web-ui
  PKG: packages/pi-web-ui/package.nix

jobs:
  update:
    runs-on: ubuntu-24.04
    # pnpm fetch + electron 下载 + node-pty 编译，留足余量
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # v21 起 determinate 默认 true（会改装 Determinate Nix 并登录 FlakeHub），
      # 显式关闭以继续使用上游 Nix，保持与 v16 相同的行为
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - name: Resolve upstream version
        id: version
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^[[:space:]]*version = "\(.*\)";.*/\1/p' "$PKG" | head -1)
          if [ -n "${REQUESTED:-}" ]; then
            new="${REQUESTED#v}"
          else
            # releases/latest 天然排除 prerelease 与 draft
            new=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name | sed 's/^v//')
          fi
          if ! printf '%s' "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::cannot determine a version number from '${new}'"
            exit 1
          fi
          {
            echo "current=${current}"
            echo "new=${new}"
            echo "changed=$([ "$current" != "$new" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "$PKG: ${current} -> ${new}"

      # 版本号、lockfile、两个 FOD hash、allowBuilds、幽灵依赖全部由脚本迭代完成：
      # hash 先置 fakeHash 强制真实 fetch（避开热 store 静默复用），allowBuilds 合并
      # 进 packages/pi-web-ui/pnpm-workspace.yaml，TS2307 幽灵依赖自动加
      # publicHoistPattern 并防死循环
      - name: Iterate hashes / allowBuilds until the build passes
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          UPGRADE_TARGET_VERSION: ${{ steps.version.outputs.new }}
        run: ./dev/pi-web-ui/upgrade.sh --no-flake-check

      - name: Compose the pull request body
        if: ${{ steps.version.outputs.changed == 'true' }}
        env:
          OLD_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          workspace_yaml="packages/pi-web-ui/pnpm-workspace.yaml"
          {
            echo "Automated update of [pi-web-ui](https://github.com/${UPSTREAM}) \`${OLD_VERSION}\` → \`${NEW_VERSION}\`."
            echo
            echo "- Upstream release: https://github.com/${UPSTREAM}/releases/tag/v${NEW_VERSION}"
            echo "- \`packages/pi-web-ui/pnpm-lock.yaml\`: regenerated by \`dev/pi-web-ui/update-pnpm-lock.sh\` from this tag's \`package-lock.json\` via \`pnpm import\`"
            echo
            echo "### Fixed-output (FOD) hashes"
            echo
            echo '```diff'
            git diff -U0 -- "$PKG" | grep -E '^[+-][[:space:]]*(sha256|hash) =' || true
            echo '```'
            if ! git diff --quiet -- "$workspace_yaml"; then
              echo
              echo "### \`${workspace_yaml}\`"
              echo
              echo '```diff'
              git diff -- "$workspace_yaml"
              echo '```'
              echo
              echo "\`allowBuilds\` entries are dependencies whose build scripts pnpm refused to run — their scripts are executed inside the sandbox, so confirm they are expected. A new \`publicHoistPattern\` scope means upstream code imports an undeclared transitive dependency (a ghost import that only resolves under npm's flat \`node_modules\`)."
            fi
            echo
            echo "\`dev/pi-web-ui/upgrade.sh\` ran \`nix build .#pi-web-ui\` and \`nix run .# -- --version\` in [this run](${RUN_URL}); the full \`nix flake check\` (NixOS VM test + home-manager) runs in this PR's CI."
            echo
            echo "Generated by \`.github/workflows/update-pi-web-ui.yml\`. The branch \`update/pi-web-ui\` is reused, so the next run rebuilds this same PR from \`main\`."
          } > /tmp/pi-web-ui-pr-body.md

      - name: Write the job summary
        if: ${{ !cancelled() }}
        env:
          OLD_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          set -uo pipefail
          workspace_yaml="packages/pi-web-ui/pnpm-workspace.yaml"
          {
            echo "## pi-web-ui ${OLD_VERSION:-?} → ${NEW_VERSION:-?}"
            echo
            if [ "${CHANGED}" != "true" ]; then
              echo "$PKG already carries the target version (or the version could not be resolved); nothing was changed."
            else
              echo "### Changed files"
              git diff --stat
              echo "### $PKG"
              git diff -- "$PKG"
              if ! git diff --quiet -- "$workspace_yaml"; then
                echo "### $workspace_yaml"
                git diff -- "$workspace_yaml"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        # 显式写 success()：构建或自检失败时绝不能开出 PR（不依赖隐式的 success()）
        if: ${{ success() && steps.version.outputs.changed == 'true' && !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          # GITHUB_TOKEN 创建的 PR 不会正常触发 ci.yml，因此优先用 PAT
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: update/pi-web-ui
          base: main
          delete-branch: false
          # 只提交这三个文件，避免把构建残留带进 PR
          add-paths: |
            packages/pi-web-ui/package.nix
            packages/pi-web-ui/pnpm-lock.yaml
            packages/pi-web-ui/pnpm-workspace.yaml
          commit-message: "chore: bump pi-web-ui to ${{ steps.version.outputs.new }}"
          title: "chore: bump pi-web-ui to ${{ steps.version.outputs.new }}"
          body-path: /tmp/pi-web-ui-pr-body.md
